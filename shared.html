<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Planner · Shared</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#273c43;background:#f7f8f5;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #4c9b97;outline-offset:2px}.app{min-height:100vh;max-width:1220px;margin:auto;padding:30px 22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font:700 29px Georgia,serif;letter-spacing:-.7px}.brand span{color:#31847c}.sub{color:#778987;font-size:12px}.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.button{border:1px solid #c9d8d4;padding:10px 15px;border-radius:9px;background:white;color:#355951;font-weight:600}.button.main{background:#317d73;color:white;border-color:#317d73}.button:hover{filter:brightness(.96)}.button.danger{color:#9d3030;border-color:#e6bebe;background:#fff7f7}.card{background:white;border:1px solid #e0e7e3;border-radius:15px;padding:22px;box-shadow:0 5px 22px #152b2107}.banner{margin:22px 0}.muted{color:#758680}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:21px 0}.stat b{font-size:27px;display:block;margin-top:8px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.filters{display:flex;gap:9px;flex-wrap:wrap}select,input,textarea{border:1px solid #cbd9d5;background:white;border-radius:8px;padding:9px 11px;color:inherit;min-width:0}textarea{min-height:110px;resize:vertical}label{display:flex;flex-direction:column;gap:5px;color:#4d6563;font-size:12px;font-weight:650}.table-wrap{overflow-x:auto;margin-top:15px}table{border-collapse:collapse;width:100%;min-width:750px}th{text-align:left;background:#eef4f1;color:#56726c;font-size:11px;text-transform:uppercase;letter-spacing:.6px}td,th{padding:13px 11px;border-bottom:1px solid #ebefed;vertical-align:middle}.task-title{border:0;background:none;padding:0;text-align:left;color:#204e50;font-weight:700}.tag{font-size:11px;border-radius:50px;background:#eaf3ef;padding:4px 9px;display:inline-block}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .button{padding:6px 9px;font-size:12px}.empty{text-align:center;padding:50px 20px;color:#84918d}.modal-back{position:fixed;inset:0;background:#132d3199;display:none;align-items:center;justify-content:center;padding:20px;z-index:3}.modal-back.show{display:flex}.modal{background:white;border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:25px}.modal h2{margin:0 0 12px;font:700 25px Georgia,serif}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.fields .wide{grid-column:1/-1}.fields input,.fields textarea,.fields select{width:100%}.desc{white-space:pre-wrap;line-height:1.7;padding:10px 0;min-height:40px}.note{padding:9px 0;border-bottom:1px solid #e9efed}.controls{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:15px}.error{color:#ad3939}.success{color:#28796b}#connectFrame{display:none;width:1px;height:1px;border:0;position:absolute;pointer-events:none}.link{color:#287d73;text-decoration:none}.link:hover{text-decoration:underline}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.fields{grid-template-columns:1fr}.fields .wide{grid-column:1}.app{padding:18px 12px}}
</style><script>
window.PROJECT_PLANNER_CONFIG = {
  appsScriptUrl: 'https://script.google.com/macros/s/AKfycbwZSpAYRa9jYrh9Sv_W4ERRobu9IwrA1M7A0Tky6C11uEuacWL0m9QfThHHd0rpocxw/exec',
  googleClientId: '536538016403-td6otlsafg785ulub02vm46mbt6i28a2.apps.googleusercontent.com'
};
</script><script src="https://accounts.google.com/gsi/client" async defer></script></head>
<body><iframe id="connectFrame" title="Secure Google Sheets connection"></iframe><div class="app"><header class="top"><div><div class="brand">✳ Project <span>Planner</span></div><div class="sub">Shared projects, teams, and hours · Google Sheets</div></div><div class="top-actions"><a class="link" href="index.html">Local board</a><div id="signIn"></div><span class="sub" id="identity"></span><button class="button" id="signOut" hidden>Sign out</button><button class="button" id="reload" disabled>↻ Refresh</button></div></header>
<div class="card banner" id="notice">Checking shared backend setup…</div>
<section id="mainApp" hidden><div class="head"><div><h1 style="margin:0 0 8px;font:700 27px Georgia,serif">Tasks</h1><div class="sub" id="roleDescription"></div></div><div class="filters"><select id="project"></select><select id="assigneeFilter"><option value="">All assignees</option></select><button class="button main" id="newTask" hidden>+ Task</button></div></div>
<div class="grid"><div class="card stat"><span class="muted">Total tasks</span><b id="total">0</b></div><div class="card stat"><span class="muted">Completed</span><b id="completed">0</b></div><div class="card stat"><span class="muted">Logged hours</span><b id="hours">0h</b></div></div>
<div class="card" style="margin-bottom:16px"><div class="head"><h2 style="font:700 19px Georgia,serif;margin:0">Milestones & features</h2></div><div id="milestoneList" style="margin-top:14px"></div></div><div class="card" style="margin-bottom:16px"><div class="head"><h2 style="font:700 19px Georgia,serif;margin:0">Project team</h2><button class="button main" id="inviteMember" hidden>+ Invite member</button></div><div id="teamList" style="margin-top:14px"></div></div><div class="card"><div class="head"><h2 style="font:700 19px Georgia,serif;margin:0">Project board</h2><div class="actions" id="pmActions"></div></div><div class="table-wrap"><table><thead><tr><th>Task</th><th>Feature / milestone</th><th>Assigned</th><th>Status</th><th>Est.</th><th>Logged</th><th>Actions</th></tr></thead><tbody id="tasks"></tbody></table></div></div></section></div>
<div class="modal-back" id="back"><div class="modal" role="dialog" aria-modal="true"><div class="head"><h2 id="modalTitle"></h2><button class="button" id="close">×</button></div><div id="modalBody"></div></div></div>
<script>
'use strict';
const $=q=>document.querySelector(q),cfg=window.PROJECT_PLANNER_CONFIG||{},ST=['To do','In progress','Blocked','Done'],PRI=['Low','Normal','High','Urgent'];
let token='',port=null,data=null,activeProject='',seq=0,authEpoch=0;const waiting=new Map();
const ACCOUNT_KEY='project-planner-preferred-account', PROJECT_KEY='project-planner-last-project';
function getPref(k){try{return localStorage.getItem(k)||''}catch{return ''}}
function setPref(k,v){try{localStorage.setItem(k,v)}catch{}}
function removePref(k){try{localStorage.removeItem(k)}catch{}}

const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const formatHours=n=>nice(n)+'h';
const find=(arr,id,key)=>arr.find(x=>String(x[key])===String(id));
const member=id=>find(data.members,id,'member_id')?.display_name||'Unassigned';
const feature=id=>find(data.features,id,'feature_id');
const milestone=f=>find(data.milestones,f?.milestone_id,'milestone_id');
const isPM=()=>data.memberships.some(x=>x.project_id===activeProject&&x.project_role==='PM');
const canUpdate=t=>isPM()||String(t.assignee_member_id)===String(data.me.member_id);
const taskHours=t=>data.logs.filter(x=>x.task_id===t.task_id).reduce((n,x)=>n+Number(x.hours||0),0);
function setNotice(msg,bad=false){$('#notice').innerHTML=msg;$('#notice').className='card banner'+(bad?' error':'')}
function connected(){return !!token&&!!port;}
function rpc(op,payload={}){return new Promise((resolve,reject)=>{if(!connected())return reject(Error('Not signed in or backend unavailable'));const id=String(++seq);const timeout=setTimeout(()=>{waiting.delete(id);reject(Error('The backend did not respond. Check your deployment.'))},30000);waiting.set(id,{resolve,reject,timeout});port.postMessage({type:'request',id,op,payload,idToken:token})})}
function acceptPort(event){if(event.data?.type!=='project-planner-bridge-ready'||!event.ports?.[0])return;
 // Only accept the bridge transferred from Apps Script's Google-hosted iframe.
 if(!/\.googleusercontent\.com$/.test(new URL(event.origin).hostname)&&event.origin!=='https://script.google.com')return;
 port=event.ports[0];port.onmessage=ev=>{const m=ev.data;if(!m||!waiting.has(m.id))return;const x=waiting.get(m.id);waiting.delete(m.id);clearTimeout(x.timeout);m.ok?x.resolve(m.value):x.reject(Error(m.error||'Server error'))};port.start();setNotice('Backend connected. Sign in with your Google account to view shared projects.');if(token)refresh();}
window.addEventListener('message',acceptPort);
async function refresh(){if(!connected())return;$('#reload').disabled=true;try{data=await rpc('load');$('#identity').textContent=data.me.display_name+' · '+data.email;setPref(ACCOUNT_KEY,data.email);$('#signOut').hidden=false;setNotice('Connected to Google Sheets. Changes here are shared with your project team.');$('#mainApp').hidden=false;const old=activeProject||getPref(PROJECT_KEY);activeProject=data.projects.some(x=>x.project_id===old)?old:(data.projects[0]?.project_id||'');render();}catch(err){setNotice(e(err.message),true);$('#mainApp').hidden=true}finally{$('#reload').disabled=false}}
function signIn(cred){if(!cred?.credential)return;token=cred.credential;refresh()}
function signOut(){
 token='';data=null;activeProject='';removePref(ACCOUNT_KEY);
 $('#mainApp').hidden=true;$('#identity').textContent='';$('#signOut').hidden=true;$('#reload').disabled=true;
 if(window.google?.accounts?.id){google.accounts.id.disableAutoSelect();google.accounts.id.cancel();}
 setNotice('Signed out. Choose Sign in with Google to sign in again or change accounts.');
}
function init(){if(!cfg.appsScriptUrl||!cfg.googleClientId){setNotice('Shared mode has been prepared but is not deployed yet. Your local board is unchanged. See <a class="link" href="https://github.com/pennipopvt/ProjectPlanner/blob/main/SHARED_SETUP.md" target="_blank" rel="noopener">setup instructions</a>.');return}
 try{const u=new URL(cfg.appsScriptUrl);if(u.protocol!=='https:'||u.hostname!=='script.google.com'||!u.pathname.endsWith('/exec'))throw Error('Invalid Apps Script URL');$('#connectFrame').src=u.href}catch(err){setNotice('Invalid backend URL in shared-config.js',true);return}
 const check=()=>{if(!window.google?.accounts?.id){setTimeout(check,250);return}window.google.accounts.id.initialize({client_id:cfg.googleClientId,callback:signIn,auto_select:true,use_fedcm_for_prompt:true});
 window.google.accounts.id.renderButton($('#signIn'),{theme:'outline',size:'medium',text:'signin_with',width:185});
 const remembered=getPref(ACCOUNT_KEY);
 if(remembered){$('#identity').textContent='Previously used: '+remembered;google.accounts.id.prompt();}
};check();setNotice('Connecting to Google Apps Script…');}
function field(name,label,value='',type='text',wide=false){return `<label class="${wide?'wide':''}">${e(label)}<input name="${e(name)}" type="${type}" value="${e(value)}" ${type==='number'?'min="0" step="0.25"':''}></label>`}
function select(name,label,items,selected,wide=false){return `<label class="${wide?'wide':''}">${e(label)}<select name="${e(name)}">${items.map(x=>`<option value="${e(x.value)}" ${String(x.value)===String(selected)?'selected':''}>${e(x.label)}</option>`).join('')}</select></label>`}
function opts(arr,k,label='name'){return arr.map(x=>({value:x[k],label:x[label]}))}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#back').classList.add('show')}
function closeModal(){$('#back').classList.remove('show')}
$('#close').onclick=closeModal;$('#back').addEventListener('click',ev=>{if(ev.target.id==='back')closeModal()});
function projectFeatures(){return data.features.filter(x=>x.project_id===activeProject)}
function projectMembers(){const ids=new Set((data.team||[]).filter(x=>x.project_id===activeProject&&x.membership_status==='Active').map(x=>String(x.member_id)));return data.members.filter(x=>ids.has(String(x.member_id)))}
function render(){const proj=data.projects.filter(p=>data.memberships.some(m=>m.project_id===p.project_id));$('#project').innerHTML=proj.map(p=>`<option value="${e(p.project_id)}" ${p.project_id===activeProject?'selected':''}>${e(p.project_name)}</option>`).join('');const who=projectMembers();$('#assigneeFilter').innerHTML='<option value="">All assignees</option>'+who.map(m=>`<option value="${e(m.member_id)}">${e(m.display_name)}</option>`).join('');$('#newTask').hidden=!isPM();$('#inviteMember').hidden=!isPM();$('#roleDescription').textContent=isPM()?'Project Manager · create, edit and assign tasks':'Team Member · update your assigned tasks and log work';const actions=$('#pmActions');actions.innerHTML=isPM()?'<button class="button" data-action="milestone">+ Milestone</button><button class="button" data-action="feature">+ Feature</button><button class="button" data-action="project">+ Project</button>':'';actions.onclick=ev=>{const a=ev.target.closest('[data-action]');if(a)quickCreate(a.dataset.action)};renderMilestones();renderTeam();renderTasks();}

function renderMilestones(){
  const ms=data.milestones.filter(m=>m.project_id===activeProject);
  const fs=projectFeatures();
  $('#milestoneList').innerHTML=ms.length?ms.map(m=>{
    const child=fs.filter(f=>f.milestone_id===m.milestone_id);
    const t=data.tasks.filter(x=>x.project_id===activeProject&&child.some(f=>f.feature_id===x.feature_id));
    return '<div style="padding:13px 0;border-bottom:1px solid #e7eeeb"><div class="head"><div><strong>'+e(m.name)+'</strong> <span class="tag">'+e(m.status)+'</span><div class="sub">'+e(m.description||'No description')+' · '+t.filter(x=>x.status==='Done').length+'/'+t.length+' tasks complete'+(m.target_date?' · Target '+e(m.target_date):'')+'</div></div>'+(isPM()?'<button class="button" data-milestone="'+e(m.milestone_id)+'">Edit milestone</button>':'')+'</div><div style="margin:8px 0 0 15px">'+child.map(f=>'<div class="head" style="padding:6px 0"><div class="sub">'+e(f.name)+' · '+e(f.status)+'</div>'+(isPM()?'<button class="button" data-feature="'+e(f.feature_id)+'">Edit feature</button>':'')+'</div>').join('')+'</div></div>';
  }).join(''):'<div class="sub">No milestones yet.</div>';
  $('#milestoneList').onclick=ev=>{
    const m=ev.target.closest('[data-milestone]'),f=ev.target.closest('[data-feature]');
    if(m)editMilestone(m.dataset.milestone);
    else if(f)editFeature(f.dataset.feature);
  };
}
function editMilestone(id){
  if(!isPM())return;
  const m=find(data.milestones,id,'milestone_id');if(!m)return;
  modal('Edit milestone',`<form id="actionForm"><div class="fields">${field('name','Milestone name',m.name,'text',true)}<label class="wide">Description<textarea name="description">${e(m.description||'')}</textarea></label>${select('status','Status',ST.map(x=>({value:x,label:x})),m.status)}${field('target_date','Target date',m.target_date||'','date')}</div><div class="controls"><button type="button" class="button" id="cancel">Cancel</button><button type="button" class="button danger" id="deleteMilestone">Delete milestone</button><button type="submit" class="button main">Save milestone</button></div></form>`);
  $('#cancel').onclick=closeModal;
  $('#deleteMilestone').onclick=()=>deleteItem('milestone',id,m.name);
  $('#actionForm').onsubmit=async ev=>{ev.preventDefault();await submit('editMilestone',{milestone_id:id,...Object.fromEntries(new FormData(ev.currentTarget).entries())})};
}
function editFeature(id){
  if(!isPM())return;
  const f=find(data.features,id,'feature_id');if(!f)return;
  const milestones=data.milestones.filter(x=>x.project_id===activeProject);
  modal('Edit feature',`<form id="actionForm"><div class="fields">${field('name','Feature name',f.name,'text',true)}<label class="wide">Description<textarea name="description">${e(f.description||'')}</textarea></label>${select('milestone_id','Milestone',milestones.map(x=>({value:x.milestone_id,label:x.name})),f.milestone_id)}${select('status','Status',ST.map(x=>({value:x,label:x})),f.status)}${field('estimated_hours','Estimated hours',f.estimated_hours||0,'number')}</div><div class="controls"><button type="button" class="button" id="cancel">Cancel</button><button type="button" class="button danger" id="deleteFeature">Delete feature</button><button type="submit" class="button main">Save feature</button></div></form>`);
  $('#cancel').onclick=closeModal;
  $('#deleteFeature').onclick=()=>deleteItem('feature',id,f.name);
  $('#actionForm').onsubmit=async ev=>{ev.preventDefault();await submit('editFeature',{feature_id:id,...Object.fromEntries(new FormData(ev.currentTarget).entries())})};
}

function renderTeam(){
 const memberships=(data.team||[]).filter(x=>x.project_id===activeProject);
 const roster=data.roster||data.members;
 $('#teamList').innerHTML=memberships.map(m=>{
  const p=roster.find(x=>x.member_id===m.member_id)||data.members.find(x=>x.member_id===m.member_id);
  const pending=m.membership_status!=='Active';
  return '<div class="head" style="padding:12px 0;border-bottom:1px solid #edf0ef"><div><b>'+e(p?.display_name||'Unknown')+'</b> <span class="tag">'+e(m.project_role)+'</span><div class="sub">'+e(m.discipline||'')+(isPM()&&p?.google_email?' · '+e(p.google_email):'')+'</div></div><div class="actions"><span class="tag" style="'+(pending?'background:#fff2d8;color:#865d18':'')+'">'+e(m.membership_status)+'</span>'+(isPM()?'<button class="button" data-member="'+e(m.member_id)+'">'+(pending?'Verify / edit':'Edit')+'</button>':'')+'</div></div>';
 }).join('')+(isPM()?'<p class="sub" style="line-height:1.7;margin-top:14px">To activate someone marked Pending verification, click <b>Verify / edit</b> and enter the Google email they use to sign in. Save, then share <a class="link" href="https://pennipopvt.github.io/ProjectPlanner/shared.html" target="_blank" rel="noopener">this board link</a>. In Google OAuth Testing mode, add the email under Google Auth Platform → Audience → Test users. Removing someone only revokes access to this project; their history is retained.</p>':'');
 $('#teamList').onclick=ev=>{const btn=ev.target.closest('[data-member]');if(btn)editMember(btn.dataset.member)};
}
function editMember(id){
 if(!isPM())return;
 const membership=(data.team||[]).find(m=>m.project_id===activeProject&&String(m.member_id)===String(id));
 const person=(data.roster||[]).find(x=>String(x.member_id)===String(id))||data.members.find(x=>String(x.member_id)===String(id));
 if(!membership||!person)return;
 const canRemove=membership.project_role!=='PM'&&String(id)!==String(data.me.member_id);
 modal('Edit team member',`<form id="actionForm"><div class="fields">${field('display_name','Name',person.display_name||'','text',true)}${field('google_email','Google sign-in email',person.google_email||'','email',true)}${field('discipline','Team responsibility',membership.discipline||'','text',true)}</div><p class="sub">Adding a valid Google email activates a pending member. Leaving the email blank keeps them pending. Changes to someone's email may affect other projects where they are a member.</p><div class="controls"><button type="button" class="button" id="cancel">Cancel</button>${canRemove?'<button type="button" class="button danger" id="removeMember">Remove from project</button>':''}<button type="submit" class="button main">Save member</button></div></form>`);
 $('#cancel').onclick=closeModal;
 if(canRemove)$('#removeMember').onclick=()=>removeMember(id,person.display_name);
 $('#actionForm').onsubmit=async ev=>{ev.preventDefault();await submit('updateMember',{project_id:activeProject,member_id:id,...Object.fromEntries(new FormData(ev.currentTarget).entries())})};
}
async function removeMember(id,name){
 if(!isPM())return;
 const assigned=data.tasks.filter(t=>t.project_id===activeProject&&String(t.assignee_member_id)===String(id));
 if(assigned.length){alert('Reassign '+assigned.length+' task(s) before removing '+name+'.');return;}
 if(!confirm('Remove '+name+' from this project? They will lose access, but their historic work logs and member record will be preserved.'))return;
 try{await rpc('removeMember',{project_id:activeProject,member_id:id});closeModal();await refresh()}catch(err){alert(err.message)}
}

function renderTasks(){let ts=data.tasks.filter(x=>x.project_id===activeProject);const filter=$('#assigneeFilter').value;if(filter)ts=ts.filter(x=>x.assignee_member_id===filter);$('#total').textContent=ts.length;$('#completed').textContent=ts.filter(x=>x.status==='Done').length;$('#hours').textContent=formatHours(ts.reduce((n,t)=>n+taskHours(t),0));$('#tasks').innerHTML=ts.length?ts.map(t=>{const f=feature(t.feature_id),m=milestone(f),update=canUpdate(t);return `<tr><td><button class="task-title" data-detail="${e(t.task_id)}">${e(t.title)}</button><div class="sub">${e(t.priority)}</div></td><td>${e(f?.name||'—')}<div class="sub">${e(m?.name||'')}</div></td><td>${e(member(t.assignee_member_id))}</td><td>${update?`<select data-status="${e(t.task_id)}" aria-label="Status for ${e(t.title)}">${ST.map(s=>`<option ${s===t.status?'selected':''}>${e(s)}</option>`).join('')}</select>`:`<span class="tag">${e(t.status)}</span>`}</td><td>${formatHours(t.estimated_hours)}</td><td>${formatHours(taskHours(t))}</td><td><div class="actions">${update?`<button class="button" data-log="${e(t.task_id)}">+ Hours</button>`:''}${isPM()?`<button class="button" data-edit="${e(t.task_id)}">Edit</button>`:''}</div></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No tasks yet. A PM can create the first one.</td></tr>';
$('#tasks').onclick=ev=>{const btn=ev.target.closest('button');if(!btn)return;if(btn.dataset.detail)details(btn.dataset.detail);if(btn.dataset.edit)editTask(btn.dataset.edit);if(btn.dataset.log)logHours(btn.dataset.log)};
$('#tasks').onchange=async ev=>{const sel=ev.target.closest('[data-status]');if(!sel)return;sel.disabled=true;try{await rpc('setStatus',{task_id:sel.dataset.status,status:sel.value});await refresh()}catch(err){alert(err.message);await refresh()}};}
function details(id){const t=find(data.tasks,id,'task_id');if(!t)return;const f=feature(t.feature_id),m=milestone(f);const logs=data.logs.filter(x=>x.task_id===id);modal(t.title,`<div class="sub">${e(m?.name||'No milestone')} / ${e(f?.name||'No feature')}</div><p class="desc">${e(t.description||'No description yet.')}</p><p><b>Assigned:</b> ${e(member(t.assignee_member_id))} · <b>Status:</b> ${e(t.status)} · <b>Remaining:</b> ${formatHours(t.remaining_hours)}</p><h3>Time entries</h3>${logs.length?logs.map(l=>`<div class="note">${e(member(l.member_id))} · ${e(l.work_date)} · <b>${formatHours(l.hours)}</b><div class="sub">${e(l.note)}</div></div>`).join(''):'<p class="muted">No work logged yet.</p>'}<div class="controls">${canUpdate(t)?'<button class="button main" id="detailLog">Log hours</button>':''}${isPM()?'<button class="button" id="detailEdit">Edit</button>':''}</div>`);if($('#detailLog'))$('#detailLog').onclick=()=>logHours(id);if($('#detailEdit'))$('#detailEdit').onclick=()=>editTask(id)}
function taskForm(t){const fs=projectFeatures(),who=projectMembers(),f=fs.find(x=>x.feature_id===t?.feature_id);modal(t?'Edit task':'New task',`<form id="actionForm"><div class="fields">${field('title','Task title',t?.title||'','text',true)}<label class="wide">Description<textarea name="description">${e(t?.description||'')}</textarea></label>${select('feature_id','Feature',opts(fs,'feature_id'),f?.feature_id||fs[0]?.feature_id)}${select('assignee_member_id','Assigned to',opts(who,'member_id','display_name'),t?.assignee_member_id||who[0]?.member_id)}${select('status','Status',ST.map(x=>({value:x,label:x})),t?.status||'To do')}${select('priority','Priority',PRI.map(x=>({value:x,label:x})),t?.priority||'Normal')}${field('estimated_hours','Estimated hours',t?.estimated_hours||0,'number')}${field('remaining_hours','Remaining hours',t?.remaining_hours||0,'number')}</div><div class="controls"><button type="button" class="button" id="cancel">Cancel</button>${t?'<button class="button danger" type="button" id="deleteTask">Delete task</button>':''}<button class="button main" type="submit">Save task</button></div></form>`);$('#cancel').onclick=closeModal;if(t)$('#deleteTask').onclick=()=>deleteItem('task',t.task_id,t.title);$('#actionForm').onsubmit=async ev=>{ev.preventDefault();const p=Object.fromEntries(new FormData(ev.currentTarget).entries());p.project_id=activeProject;if(t)p.task_id=t.task_id;await submit(t?'editTask':'createTask',p)}}
function editTask(id){const t=find(data.tasks,id,'task_id');if(t&&isPM())taskForm(t)}
function logHours(id){const t=find(data.tasks,id,'task_id');if(!t||!canUpdate(t))return;modal('Log work · '+t.title,`<form id="actionForm"><div class="fields">${field('hours','Hours worked','0.5','number')}${field('work_date','Work date',new Date().toLocaleDateString('en-CA'),'date')}<label class="wide">Notes<textarea name="note" placeholder="What did you complete?"></textarea></label></div><div class="controls"><button type="button" class="button" id="cancel">Cancel</button><button class="button main">Add work log</button></div></form>`);$('#cancel').onclick=closeModal;$('#actionForm').onsubmit=async ev=>{ev.preventDefault();await submit('logHours',{task_id:id,...Object.fromEntries(new FormData(ev.currentTarget).entries())})}}
function quickCreate(kind){const milestones=data.milestones.filter(x=>x.project_id===activeProject);let body='',op='';if(kind==='milestone'){op='createMilestone';body=field('name','Milestone name','','text',true)+'<label class="wide">Description<textarea name="description"></textarea></label>'}else if(kind==='feature'){op='createFeature';body=field('name','Feature name','','text',true)+select('milestone_id','Milestone',opts(milestones,'milestone_id'),milestones[0]?.milestone_id)}else if(kind==='member'){op='addMember';body=field('display_name','Member name','','text',true)+field('google_email','Google sign-in email','','email',true)+field('discipline','Discipline / role description')}else if(kind==='project'){op='createProject';body=field('name','Project name','','text',true)+'<label class="wide">Description<textarea name="description"></textarea></label>'}modal('Create '+kind,`<form id="actionForm"><div class="fields">${body}</div><div class="controls"><button type="button" class="button" id="cancel">Cancel</button><button class="button main">Create</button></div></form>`);$('#cancel').onclick=closeModal;$('#actionForm').onsubmit=async ev=>{ev.preventDefault();await submit(op,{project_id:activeProject,...Object.fromEntries(new FormData(ev.currentTarget).entries())})}}
async function submit(op,payload){const btn=$('#actionForm button[type="submit"],#actionForm button:not([type])');if(btn)btn.disabled=true;try{await rpc(op,payload);closeModal();await refresh()}catch(err){alert(err.message);if(btn)btn.disabled=false}}
function deleteItem(kind,id,name){
 if(!isPM())return;
 const descendants=kind==='milestone'?data.features.filter(f=>f.milestone_id===id).length:kind==='feature'?data.tasks.filter(t=>t.feature_id===id).length:0;
 if(descendants){alert(`This ${kind} still has ${descendants} ${kind==='milestone'?'feature(s)':'task(s)'}. Move or delete them first.`);return;}
 const logs=kind==='task'?data.logs.filter(l=>l.task_id===id).length:0;
 const message=`Permanently delete ${kind} “${name}”?`+(logs?` This also permanently deletes ${logs} time log(s).`:'')+' This cannot be undone.';
 if(!confirm(message))return;
 rpc('delete'+kind[0].toUpperCase()+kind.slice(1),{[kind+'_id']:id}).then(async()=>{closeModal();await refresh()}).catch(err=>alert(err.message));
}
$('#inviteMember').onclick=()=>quickCreate('member');
$('#newTask').onclick=()=>taskForm(null);$('#project').onchange=ev=>{activeProject=ev.target.value;setPref(PROJECT_KEY,activeProject);render()};$('#assigneeFilter').onchange=renderTasks;$('#reload').onclick=refresh;$('#signOut').onclick=signOut;
init();
</script></body></html>
