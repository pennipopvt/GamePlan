/* GamePlan navigation, analytics, and reusable task templates */
.gp-short{display:none}

<script>
'use strict';
const $=q=>document.querySelector(q),ST=['To do','In progress','Blocked','Done'],PRI=['Low','Normal','High','Urgent'];
const LOCAL_KEY='little-dock-local-v2',LEGACY_KEY='little-dock-v1',PROJECT_KEY='little-dock-local-project',APP_VERSION='2026.11.04.14';
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const pm={member_id:'penni',display_name:'Penni',google_email:'',active:'Yes'};
const defaultTeam=['Ethan','Jerry','Jenny'];
let data=null,activeProject='',noticeTimer=null,activeView='all';const collapsedMilestones=new Set(),collapsedFeatures=new Set();
function persist(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(data))}catch(err){gpAlert('Could not save locally: '+err.message);throw err}}
function readProject(){try{return localStorage.getItem(PROJECT_KEY)||''}catch{return ''}}
function saveProject(){try{localStorage.setItem(PROJECT_KEY,activeProject)}catch{}}
function seedData(){
 const project_id='fish-poc';
 const members=[pm,...defaultTeam.map(name=>({member_id:name.toLowerCase(),display_name:name,google_email:'',active:'Yes'}))];
 return {me:{member_id:'penni',display_name:'Penni'},email:'',projects:[{project_id,project_name:'Fishing Game — Proof of Concept',description:'',status:'Active',project_manager_member_id:'penni'}],members,roster:members.map(m=>({...m})),
 memberships:[{project_id,member_id:'penni',project_role:'PM',discipline:'Project management',membership_status:'Active'}],
 team:members.map(m=>({project_id,member_id:m.member_id,project_role:m.member_id==='penni'?'PM':'Member',discipline:'',membership_status:'Active'})),
 milestones:[],features:[],tasks:[],logs:[]};
}
function migrateLegacy(legacy){
 const next=seedData();const id='fish-poc';
 for(const m of legacy.milestones||[])next.milestones.push({milestone_id:String(m.id),project_id:id,name:m.name,description:m.description||'',status:m.status||'To do',target_date:m.target_date||''});
 for(const f of legacy.features||[])next.features.push({feature_id:String(f.id),project_id:id,milestone_id:String(f.milestoneId),name:f.name,description:f.description||'',status:f.status||'To do',estimated_hours:Number(f.estimate||0)});
 const known=new Set(next.members.map(m=>m.display_name));
 for(const t of legacy.tasks||[]){
  const name=t.assignee||'Unassigned';
  if(name!=='Unassigned'&&!known.has(name)){const member_id=uid();next.members.push({member_id,display_name:name,google_email:'',active:'Yes'});next.roster.push({...next.members[next.members.length-1]});next.team.push({project_id:id,member_id,project_role:'Member',discipline:'',membership_status:'Active'});known.add(name)}
  const assigned=next.members.find(m=>m.display_name===name)?.member_id||'';
  next.tasks.push({task_id:String(t.id),project_id:id,feature_id:String(t.featureId),title:t.name||'Untitled task',description:t.description||'',assignee_member_id:assigned,status:t.status||'To do',priority:t.priority||'Normal',estimated_hours:Number(t.estimate||0),remaining_hours:Number(t.remaining||0),created_by_member_id:'penni',updated_at:''});
  for(const entry of t.logs||[])next.logs.push({log_id:uid(),task_id:String(t.id),member_id:assigned||'penni',work_date:entry.date||'',hours:Number(entry.hours||0),note:entry.note||'',created_at:''});
 }
 return next;
}
function normalizeLocal(x){
 if(!x||!Array.isArray(x.projects)||!Array.isArray(x.tasks)||!Array.isArray(x.features)||!Array.isArray(x.milestones))throw Error('Unsupported backup format');
 if(!Array.isArray(x.team)||!Array.isArray(x.members))throw Error('Missing team information');
 x.roster=Array.isArray(x.roster)?x.roster:x.members.map(m=>({...m}));
 x.memberships=Array.isArray(x.memberships)?x.memberships:[];
 x.logs=Array.isArray(x.logs)?x.logs:[];
 x.me={member_id:'penni',display_name:'Penni'};
 return x;
}
function loadLocal(){
 try{const saved=localStorage.getItem(LOCAL_KEY);if(saved)return normalizeLocal(JSON.parse(saved))}catch(err){gpAlert('Could not read local board: '+err.message)}
 try{const old=localStorage.getItem(LEGACY_KEY);if(old){const migrated=migrateLegacy(JSON.parse(old));localStorage.setItem(LOCAL_KEY,JSON.stringify(migrated));return migrated;}}catch(err){gpAlert('Could not migrate the original board: '+err.message)}
 return seedData();
}
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const formatHours=n=>{const total=Math.round(Number(n||0)*60),h=Math.floor(total/60),m=total%60;return h&&m?`${h}h ${m}m`:h?`${h}h`:`${m}m`};
const find=(arr,id,key)=>arr.find(x=>String(x[key])===String(id));
const member=id=>find(data.members,id,'member_id')?.display_name||'Unassigned';
const feature=id=>find(data.features,id,'feature_id');
const milestone=f=>find(data.milestones,f?.milestone_id,'milestone_id');
const isPM=()=>true;
const canUpdate=t=>isPM()||String(t.assignee_member_id)===String(data.me.member_id);
const taskHours=t=>data.logs.filter(x=>x.task_id===t.task_id).reduce((n,x)=>n+Number(x.hours||0),0);
const featureHours=id=>data.tasks.filter(t=>String(t.feature_id)===String(id)).reduce((sum,t)=>sum+taskHours(t),0);
// Feature status is derived from ALL of its tasks, never from a manual field.
// Blocked takes precedence unless every task is done. Partial completion counts as in progress.
const featureStatus=id=>{
 const tasks=data.tasks.filter(t=>String(t.feature_id)===String(id));
 if(!tasks.length||tasks.every(t=>t.status==='To do'))return 'To do';
 if(tasks.every(t=>t.status==='Done'))return 'Done';
 if(tasks.some(t=>t.status==='Blocked'))return 'Blocked';
 return 'In progress';
};
const statusClass=status=>({'To do':'status-todo','In progress':'status-progress','Blocked':'status-blocked','Done':'status-done'})[status]||'status-todo';
function gpAlert(message){
 let layer=document.getElementById('gpToast');
 if(!layer){layer=document.createElement('div');layer.id='gpToast';layer.className='gp-toast';layer.setAttribute('role','alert');document.body.appendChild(layer)}
 layer.replaceChildren();
 const text=document.createElement('span');text.textContent=String(message);
 const dismiss=document.createElement('button');dismiss.className='button';dismiss.type='button';dismiss.textContent='Close';dismiss.onclick=()=>layer.hidden=true;
 layer.append(text,dismiss);layer.hidden=false;
}
function setNotice(msg,bad=false){const el=$('#notice');el.innerHTML=msg;el.className='card banner'+(bad?' error':'');el.hidden=/^Local mode ·/.test(msg)}

function rpc(op,p={}){
 try{
  if(op==='load')return Promise.resolve(data);
  const projectId=p.project_id||activeProject;
  const get=(arr,key,id)=>arr.find(x=>String(x[key])===String(id));
  const required=(value,name)=>{if(!String(value??'').trim())throw Error(name+' is required');return String(value).trim()};
  const hours=v=>{const n=Number(v||0);if(!Number.isFinite(n)||n<0)throw Error('Hours must be positive');return n};
  const parent=(arr,key,id)=>{const item=get(arr,key,id);if(!item||item.project_id!==projectId)throw Error('Invalid parent');return item};
  const task=get(data.tasks,'task_id',p.task_id);
  if(op==='createProject'){
   const id=uid();data.projects.push({project_id:id,project_name:required(p.name,'Project name'),description:p.description||'',status:'Active',project_manager_member_id:'penni'});
   data.team.push({project_id:id,member_id:'penni',project_role:'PM',discipline:'',membership_status:'Active'});activeProject=id;saveProject();
  }else if(op==='createMilestone'){
   data.milestones.push({milestone_id:uid(),project_id:projectId,name:required(p.name,'Milestone name'),description:p.description||'',status:'To do',target_date:''});
  }else if(op==='editMilestone'){
   const m=parent(data.milestones,'milestone_id',p.milestone_id);Object.assign(m,{name:required(p.name,'Milestone name'),description:p.description||'',status:p.status,target_date:p.target_date||''});
  }else if(op==='deleteMilestone'){
   const m=parent(data.milestones,'milestone_id',p.milestone_id);
   // Delete only descendants of this milestone in the active project.
   const ids=new Set(data.features.filter(f=>f.project_id===projectId&&f.milestone_id===m.milestone_id).map(f=>String(f.feature_id)));
   const taskIds=new Set(data.tasks.filter(t=>t.project_id===projectId&&ids.has(String(t.feature_id))).map(t=>String(t.task_id)));
   data.logs=data.logs.filter(l=>!taskIds.has(String(l.task_id)));
   data.tasks=data.tasks.filter(t=>!taskIds.has(String(t.task_id)));
   data.features=data.features.filter(f=>!ids.has(String(f.feature_id)));
   data.milestones=data.milestones.filter(x=>x!==m);
  }else if(op==='createFeature'){
   const m=parent(data.milestones,'milestone_id',p.milestone_id);
   data.features.push({feature_id:uid(),project_id:projectId,milestone_id:m.milestone_id,name:required(p.name,'Feature name'),description:p.description||'',status:'To do',estimated_hours:0});
  }else if(op==='editFeature'){
   const f=parent(data.features,'feature_id',p.feature_id),m=parent(data.milestones,'milestone_id',p.milestone_id);
   Object.assign(f,{name:required(p.name,'Feature name'),description:p.description||'',milestone_id:m.milestone_id});
  }else if(op==='deleteFeature'){
   const f=parent(data.features,'feature_id',p.feature_id);
   const removedTasks=data.tasks.filter(t=>t.project_id===projectId&&String(t.feature_id)===String(f.feature_id));
   const ids=new Set(removedTasks.map(t=>String(t.task_id)));
   data.logs=data.logs.filter(l=>!ids.has(String(l.task_id)));
   data.tasks=data.tasks.filter(t=>!ids.has(String(t.task_id)));
   data.features=data.features.filter(x=>x!==f);
  }else if(op==='createTask'){
   const f=parent(data.features,'feature_id',p.feature_id);
   data.tasks.push({task_id:uid(),project_id:projectId,feature_id:f.feature_id,title:required(p.title,'Task title'),description:p.description||'',assignee_member_id:p.assignee_member_id||'',status:p.status||'To do',priority:p.priority||'Normal',estimated_hours:hours(p.estimated_hours),remaining_hours:hours(p.remaining_hours),created_by_member_id:'penni',updated_at:new Date().toISOString()});
  }else if(op==='editTask'){
   if(!task)throw Error('Task not found');
   parent(data.features,'feature_id',p.feature_id);
   Object.assign(task,{feature_id:p.feature_id,title:required(p.title,'Task title'),description:p.description||'',assignee_member_id:p.assignee_member_id||'',status:p.status,priority:p.priority,estimated_hours:hours(p.estimated_hours),remaining_hours:hours(p.remaining_hours),updated_at:new Date().toISOString()});
  }else if(op==='setStatus'){
   if(!task)throw Error('Task not found');task.status=p.status;task.updated_at=new Date().toISOString();
  }else if(op==='deleteTask'){
   if(!task)throw Error('Task not found');
   data.logs=data.logs.filter(l=>l.task_id!==task.task_id);data.tasks=data.tasks.filter(x=>x!==task);
  }else if(op==='logHours'){
   if(!task)throw Error('Task not found');
   const minutes=Number(p.minutes);if(!Number.isSafeInteger(minutes)||minutes<=0)throw Error('Enter a positive whole number of minutes');
   const h=minutes/60;
   data.logs.push({log_id:uid(),task_id:task.task_id,member_id:task.assignee_member_id||'penni',hours:h,work_date:p.work_date||new Date().toISOString().slice(0,10),note:p.note||'',created_at:new Date().toISOString()});
  }else if(op==='editLog'){
   if(!task)throw Error('Task not found');
   const log=get(data.logs,'log_id',p.log_id);
   if(!log || String(log.task_id)!==String(task.task_id))throw Error('Time entry not found');
   const minutes=Number(p.minutes);
   if(!Number.isSafeInteger(minutes)||minutes<=0)throw Error('Enter a positive whole number of minutes');
   Object.assign(log,{hours:minutes/60,work_date:p.work_date||log.work_date,note:p.note||''});
  }else if(op==='deleteLog'){
   if(!task)throw Error('Task not found');
   const log=get(data.logs,'log_id',p.log_id);
   if(!log || String(log.task_id)!==String(task.task_id))throw Error('Time entry not found');
   data.logs=data.logs.filter(x=>x!==log);
  }else if(op==='addMember'){
   const name=required(p.display_name,'Member name'),email=(p.google_email||'').trim().toLowerCase();
   let m=data.members.find(x=>x.display_name.toLowerCase()===name.toLowerCase());
   if(!m){m={member_id:uid(),display_name:name,google_email:email,active:'Yes'};data.members.push(m);data.roster.push({...m})}
   if(data.team.some(t=>t.project_id===projectId&&t.member_id===m.member_id))throw Error('Already on this project. Use Edit instead.');
   data.team.push({project_id:projectId,member_id:m.member_id,project_role:'Member',discipline:p.discipline||'',membership_status:'Active'});
  }else if(op==='updateMember'){
   const m=get(data.members,'member_id',p.member_id);const team=data.team.find(t=>t.project_id===projectId&&t.member_id===p.member_id);
   if(!m||!team)throw Error('Member not found');
   m.display_name=required(p.display_name,'Member name');m.google_email=p.google_email||'';team.discipline=p.discipline||'';team.membership_status='Active';
   const roster=get(data.roster,'member_id',m.member_id);if(roster)Object.assign(roster,m);
  }else if(op==='removeMember'){
   if(p.member_id==='penni')throw Error('Cannot remove project manager');
   if(data.tasks.some(t=>t.project_id===projectId&&t.assignee_member_id===p.member_id))throw Error('Reassign this member’s tasks first');
   data.team=data.team.filter(t=>!(t.project_id===projectId&&t.member_id===p.member_id));
  }else throw Error('Unknown operation '+op);
  persist();return Promise.resolve({ok:true});
 }catch(err){return Promise.reject(err)}
}
function refresh(){
 data=loadLocal();
 const old=activeProject||readProject();
 activeProject=data.projects.some(p=>p.project_id===old)?old:(data.projects[0]?.project_id||'');

}

function field(name,label,value='',type='text',wide=false){return `<label class="${wide?'wide':''}">${e(label)}<input name="${e(name)}" type="${type}" value="${e(value)}" ${type==='number'?'min="0" step="0.25"':''}></label>`}
function select(name,label,items,selected,wide=false){return `<label class="${wide?'wide':''}">${e(label)}<select name="${e(name)}">${items.map(x=>`<option value="${e(x.value)}" ${String(x.value)===String(selected)?'selected':''}>${e(x.label)}</option>`).join('')}</select></label>`}
function opts(arr,k,label='name'){return arr.map(x=>({value:x[k],label:x[label]}))}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#back').classList.add('show')}
function closeModal(){$('#back').classList.remove('show')}
$('#close').onclick=closeModal;$('#back').addEventListener('click',ev=>{if(ev.target.id==='back')closeModal()});
function projectFeatures(){return data.features.filter(x=>x.project_id===activeProject)}
function projectMembers(){const ids=new Set((data.team||[]).filter(x=>x.project_id===activeProject&&x.membership_status==='Active').map(x=>String(x.member_id)));return data.members.filter(x=>ids.has(String(x.member_id)))}

function projectTasks(){return data.tasks.filter(t=>t.project_id===activeProject)}
function visibleTasks(){
 const term=$('#searchTasks').value.trim().toLowerCase(),assignee=$('#assigneeFilter').value;
 return projectTasks().filter(t=>{
  if(activeView==='open'&&t.status==='Done')return false;
  if(activeView==='done'&&t.status!=='Done')return false;
  if(activeView.startsWith('m:')){
   const f=feature(t.feature_id);
   if(String(f?.milestone_id)!==activeView.slice(2))return false;
  }
  if(assignee&&String(t.assignee_member_id)!==assignee)return false;
  const f=feature(t.feature_id),m=milestone(f);
  return !term||[t.title,t.description,member(t.assignee_member_id),f?.name,m?.name].join(' ').toLowerCase().includes(term);
 });
}
function renderNavigation(){
 const total=projectTasks();
 const items=[['all','All tasks',total.length],['open','Open tasks',total.filter(t=>t.status!=='Done').length],['done','Completed',total.filter(t=>t.status==='Done').length]];
 $('#viewNav').innerHTML=items.map(([id,label,count])=>`<button class="side-link ${activeView===id?'active':''}" data-view="${id}"><span>${e(label)}</span><span class="side-count">${count}</span></button>`).join('');
 $('#milestoneNav').innerHTML=data.milestones.filter(m=>m.project_id===activeProject).map(m=>{
  const fids=new Set(data.features.filter(f=>f.milestone_id===m.milestone_id).map(f=>f.feature_id));
  const count=total.filter(t=>fids.has(t.feature_id)).length;
  return `<button class="side-link ${activeView==='m:'+m.milestone_id?'active':''}" data-view="m:${e(m.milestone_id)}"><span>${e(m.name)}</span><span class="side-count">${count}</span></button>`;
 }).join('')||'<span class="sub" style="padding:10px">No milestones yet</span>';
 const click=ev=>{const btn=ev.target.closest('[data-view]');if(!btn)return;activeView=btn.dataset.view;$('#sidebar').classList.remove('visible');render()};
 $('#viewNav').onclick=click;$('#milestoneNav').onclick=click;
}
function render(){
 const projectList=data.projects;
 $('#project').innerHTML=projectList.map(p=>`<option value="${e(p.project_id)}" ${p.project_id===activeProject?'selected':''}>${e(p.project_name)}</option>`).join('');
 const who=projectMembers(),oldAssignee=$('#assigneeFilter').value;
 $('#assigneeFilter').innerHTML='<option value="">All assignees</option>'+who.map(m=>`<option value="${e(m.member_id)}">${e(m.display_name)}</option>`).join('');
 $('#assigneeFilter').value=who.some(m=>String(m.member_id)===oldAssignee)?oldAssignee:'';
 $('#newTask').hidden=true;$('#inviteMember').hidden=false;
 const m=activeView.startsWith('m:')?find(data.milestones,activeView.slice(2),'milestone_id'):null;
 $('#pageHeading').textContent=m?.name||({all:'Project Overview',open:'Open Tasks',done:'Completed Tasks'}[activeView]||'Project Overview');
 $('#roleDescription').textContent=m?.description||'Organize milestones, features, and everyone’s assigned work';
 const actions=$('#pmActions');
 actions.innerHTML='<button class="button" data-action="milestone">+ Milestone</button>';
 actions.onclick=ev=>{const a=ev.target.closest('[data-action]');if(a)quickCreate(a.dataset.action)};
 renderNavigation();renderMilestones();renderTeam();
}
function taskRow(t){
 const logs=taskHours(t);
 const statusClass=({'To do':'status-todo','In progress':'status-progress','Blocked':'status-blocked','Done':'status-done'})[t.status]||'status-todo';
 return `<div class="task-entry ${statusClass}"><div><button class="task-title ${t.status==='Done'?'task-done':''}" data-detail="${e(t.task_id)}">${e(t.title)}</button><div class="sub">${e(t.priority)} · ${formatHours(t.estimated_hours)} estimated · ${formatHours(logs)} logged</div></div><div class="meta-person sub">${e(member(t.assignee_member_id))}</div><select class="status-select ${statusClass}" data-status="${e(t.task_id)}" aria-label="Status for ${e(t.title)}">${ST.map(status=>`<option value="${e(status)}" ${t.status===status?'selected':''}>${e(status)}</option>`).join('')}</select><div class="actions"><button data-log="${e(t.task_id)}" type="button" class="icon-edit" aria-label="Manage time: ${e(t.title)}" title="Manage time"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button><button class="icon-edit" data-edit="${e(t.task_id)}" type="button" aria-label="Edit task: ${e(t.title)}" title="Edit task"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg></button></div></div>`;
}
function renderMilestones(){
 const filtered=visibleTasks(),project=projectTasks(),isFiltered=activeView==='open'||activeView==='done'||!!$('#assigneeFilter').value||!!$('#searchTasks').value;
 $('#total').textContent=filtered.length;
 $('#completed').textContent=filtered.filter(t=>t.status==='Done').length;
 $('#hours').textContent=formatHours(filtered.reduce((n,t)=>n+taskHours(t),0));
 const ms=data.milestones.filter(m=>m.project_id===activeProject&&(!activeView.startsWith('m:')||activeView.slice(2)===String(m.milestone_id)));
 $('#milestoneList').innerHTML=ms.map(m=>{
  const fs=data.features.filter(f=>f.project_id===activeProject&&f.milestone_id===m.milestone_id);
  const allForMilestone=project.filter(t=>fs.some(f=>f.feature_id===t.feature_id));
  const shown=filtered.filter(t=>fs.some(f=>f.feature_id===t.feature_id));
  if(isFiltered&&!shown.length)return '';
  const percent=allForMilestone.length?100*allForMilestone.filter(t=>t.status==='Done').length/allForMilestone.length:0;
  const open=!collapsedMilestones.has(String(m.milestone_id));
  return `<details class="milestone-section" data-ms="${e(m.milestone_id)}" ${open?'open':''}><summary class="milestone-summary"><span class="chevron">▸</span><div class="title-stack"><strong>${e(m.name)}</strong><div class="sub">${e(m.description||'')}${m.target_date?' · Target '+e(m.target_date):''}</div><div class="progress-line"><span style="width:${percent}%"></span></div></div><div class="milestone-tools"><span class="tag">${allForMilestone.filter(t=>t.status==='Done').length}/${allForMilestone.length} done</span><button class="icon-edit" type="button" data-add-feature="${e(m.milestone_id)}" title="Add feature" aria-label="Add feature to ${e(m.name)}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M13 3v5h5"/><path d="M16 5h6M19 2v6"/></svg></button><button class="icon-edit" type="button" data-milestone="${e(m.milestone_id)}" aria-label="Edit milestone: ${e(m.name)}" title="Edit milestone"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg></button></div></summary>${fs.map(f=>{
   const tasks=shown.filter(t=>t.feature_id===f.feature_id);
   if(isFiltered&&!tasks.length)return '';
   const all=project.filter(t=>t.feature_id===f.feature_id),expanded=!collapsedFeatures.has(String(f.feature_id)),derivedStatus=featureStatus(f.feature_id);
   return `<details class="feature-section ${statusClass(derivedStatus)}" data-feat="${e(f.feature_id)}" ${expanded?'open':''}><summary class="feature-summary"><span class="chevron">▸</span><div class="title-stack"><strong>${e(f.name)} <span class="feature-hours" title="Total logged time across this feature">${formatHours(featureHours(f.feature_id))}</span></strong><div class="sub">${all.filter(t=>t.status==='Done').length}/${all.length} tasks complete · <span class="feature-status-label">${e(derivedStatus)}</span></div></div><div class="feature-heading-actions"><button class="icon-edit" type="button" data-add-task="${e(f.feature_id)}" aria-label="Add task to ${e(f.name)}" title="Add task"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M13 3v5h5"/><path d="M16 5h6M19 2v6"/></svg></button><button class="icon-edit" type="button" data-feature="${e(f.feature_id)}" aria-label="Edit feature: ${e(f.name)}" title="Edit feature"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg></button></div></summary>${tasks.map(taskRow).join('')||'<div class="empty-hierarchy">No tasks here yet.</div>'}</details>`;
  }).join('')||'<div class="empty-hierarchy">No features here yet.</div>'}</details>`;
 }).join('')||'<div class="empty-hierarchy">Nothing matches this view. Try another filter, or create a milestone and feature.</div>';
 const root=$('#milestoneList');
 root.onclick=ev=>{
  const btn=ev.target.closest('button');if(!btn)return;
  ev.preventDefault();ev.stopPropagation();
  if(btn.dataset.addFeature)quickCreate('feature',btn.dataset.addFeature);
  else if(btn.dataset.addTask)taskForm(null,btn.dataset.addTask);
  else if(btn.dataset.milestone)editMilestone(btn.dataset.milestone);
  else if(btn.dataset.feature)editFeature(btn.dataset.feature);
  else if(btn.dataset.detail)details(btn.dataset.detail);
  else if(btn.dataset.edit)editTask(btn.dataset.edit);
  else if(btn.dataset.log)logHours(btn.dataset.log);
 };
 root.onchange=async ev=>{
  const sel=ev.target.closest('[data-status]');if(!sel)return;
  sel.disabled=true;
  try{await rpc('setStatus',{task_id:sel.dataset.status,status:sel.value});render()}catch(err){gpAlert(err.message);render()}
 };
 root.querySelectorAll('details[data-ms],details[data-feat]').forEach(el=>el.addEventListener('toggle',()=>{
  const set=el.dataset.ms?collapsedMilestones:collapsedFeatures,id=String(el.dataset.ms||el.dataset.feat);
  if(el.open)set.delete(id);else set.add(id);
 }));
}
function editMilestone(id){
  if(!isPM())return;
  const m=find(data.milestones,id,'milestone_id');if(!m)return;
  modal('Edit milestone',`<form id="actionForm"><div class="fields">${field('name','Milestone name',m.name,'text',true)}<label class="wide">Description<textarea name="description">${e(m.description||'')}</textarea></label>${select('status','Status',ST.map(x=>({value:x,label:x})),m.status)}${field('target_date','Target date',m.target_date||'','date')}</div><div class="controls"><button type="button" class="button" id="cancel">Cancel</button><button type="button" class="button danger" id="deleteMilestone">Delete entire milestone</button><button type="submit" class="button main">Save milestone</button></div></form>`);
  $('#cancel').onclick=closeModal;
  $('#deleteMilestone').onclick=()=>deleteItem('milestone',id,m.name);
  $('#actionForm').onsubmit=async ev=>{ev.preventDefault();await submit('editMilestone',{milestone_id:id,...Object.fromEntries(new FormData(ev.currentTarget).entries())})};
}
function editFeature(id){
  if(!isPM())return;
  const f=find(data.features,id,'feature_id');if(!f)return;
  const milestones=data.milestones.filter(x=>x.project_id===activeProject);
  modal('Edit feature',`<form id="actionForm"><div class="fields">${field('name','Feature name',f.name,'text',true)}<label class="wide">Description<textarea name="description">${e(f.description||'')}</textarea></label>${select('milestone_id','Milestone',milestones.map(x=>({value:x.milestone_id,label:x.name})),f.milestone_id)}<div class="wide sub">Feature status: <strong>${featureStatus(f.feature_id)}</strong> (calculated automatically from tasks).</div><div class="wide sub">Total time logged on this feature: <strong>${formatHours(featureHours(f.feature_id))}</strong>. This is calculated from its tasks.</div></div><div class="controls"><button type="button" class="button" id="cancel">Cancel</button><button type="button" class="button danger" id="deleteFeature">Delete feature</button><button type="submit" class="button main">Save feature</button></div></form>`);
  $('#cancel').onclick=closeModal;
  $('#deleteFeature').onclick=()=>deleteItem('feature',id,f.name);
  $('#actionForm').onsubmit=async ev=>{ev.preventDefault();await submit('editFeature',{feature_id:id,...Object.fromEntries(new FormData(ev.currentTarget).entries())})};
}

function renderTeam(){
 const memberships=(data.team||[]).filter(x=>x.project_id===activeProject);
 const roster=data.roster||data.members;
 $('#teamList').innerHTML=memberships.map(m=>{
  const p=roster.find(x=>x.member_id===m.member_id)||data.members.find(x=>x.member_id===m.member_id);
  const pending=m.membership_status!=='Active';
  return '<div class="head" style="padding:12px 0;border-bottom:1px solid #edf0ef"><div><b>'+e(p?.display_name||'Unknown')+'</b> <span class="tag">'+e(m.project_role)+'</span><div class="sub">'+e(m.discipline||'')+(isPM()&&p?.google_email?' · '+e(p.google_email):'')+'</div></div><div class="actions"><span class="tag" style="'+(pending?'background:#fff2d8;color:#865d18':'')+'">'+e(m.membership_status)+'</span>'+(isPM()?'<button class="button" data-member="'+e(m.member_id)+'">'+(pending?'Verify / edit':'Edit')+'</button>':'')+'</div></div>';
 }).join('')+(isPM()?'<p class="sub" style="line-height:1.7;margin-top:14px">This local board has no verification or invitations. Add anyone to track their assignments; email is optional. Only this browser has the data. Export a backup if you need to move it.</p>':'');
 $('#teamList').onclick=ev=>{const btn=ev.target.closest('[data-member]');if(btn)editMember(btn.dataset.member)};
}
function editMember(id){
 if(!isPM())return;
 const membership=(data.team||[]).find(m=>m.project_id===activeProject&&String(m.member_id)===String(id));
 const person=(data.roster||[]).find(x=>String(x.member_id)===String(id))||data.members.find(x=>String(x.member_id)===String(id));
 if(!membership||!person)return;
 const canRemove=membership.project_role!=='PM'&&String(id)!==String(data.me.member_id);
 modal('Edit team member',`<form id="actionForm"><div class="fields">${field('display_name','Name',person.display_name||'','text',true)}${field('google_email','Google sign-in email',person.google_email||'','email',true)}${field('discipline','Team responsibility',membership.discipline||'','text',true)}</div><p class="sub">Email is optional for local tracking. Names and responsibilities can be edited freely.</p><div class="controls"><button type="button" class="button" id="cancel">Cancel</button>${canRemove?'<button type="button" class="button danger" id="removeMember">Remove from project</button>':''}<button type="submit" class="button main">Save member</button></div></form>`);
 $('#cancel').onclick=closeModal;
 if(canRemove)$('#removeMember').onclick=()=>removeMember(id,person.display_name);
 $('#actionForm').onsubmit=async ev=>{ev.preventDefault();await submit('updateMember',{project_id:activeProject,member_id:id,...Object.fromEntries(new FormData(ev.currentTarget).entries())})};
}
async function removeMember(id,name){
 if(!isPM())return;
 const assigned=data.tasks.filter(t=>t.project_id===activeProject&&String(t.assignee_member_id)===String(id));
 if(assigned.length){gpAlert('Reassign '+assigned.length+' task(s) before removing '+name+'.');return;}
 if(!await gpConfirm('Remove '+name+' from this project? They will lose access, but their historic work logs and member record will be preserved.',{danger:true,confirmLabel:'Remove member'}))return;
 try{await rpc('removeMember',{project_id:activeProject,member_id:id});closeModal();await refresh()}catch(err){gpAlert(err.message)}
}

function details(id){
 const t=find(data.tasks,id,'task_id');if(!t)return;
 const f=feature(t.feature_id),m=milestone(f),logs=data.logs.filter(x=>String(x.task_id)===String(id));
 modal(t.title,`<div class="sub">${e(m?.name||'No milestone')} / ${e(f?.name||'No feature')}</div><p class="desc">${e(t.description||'No description yet.')}</p><p><b>Assigned:</b> ${e(member(t.assignee_member_id))} · <b>Status:</b> ${e(t.status)} · <b>Remaining:</b> ${formatHours(t.remaining_hours)}</p><h3>Time Entries</h3>${logs.length?logs.map(l=>`<div class="note"><div class="head"><div>${e(member(l.member_id))} · ${e(l.work_date)} · <b>${formatHours(l.hours)}</b></div>${canUpdate(t)?`<div class="actions"><button class="button" type="button" data-edit-log="${e(l.log_id)}">Edit</button><button class="button danger" type="button" data-delete-log="${e(l.log_id)}">Delete</button></div>`:''}</div><div class="sub">${e(l.note)}</div></div>`).join(''):'<p class="muted">No work logged yet.</p>'}<div class="controls">${canUpdate(t)?'<button class="button main" id="detailLog">Log time</button>':''}${isPM()?'<button class="button" id="detailEdit">Edit task</button>':''}</div>`);
 if($('#detailLog'))$('#detailLog').onclick=()=>logHours(id);
 if($('#detailEdit'))$('#detailEdit').onclick=()=>editTask(id);
 $('#modalBody').onclick=ev=>{
  const edit=ev.target.closest('[data-edit-log]'),del=ev.target.closest('[data-delete-log]');
  if(edit)editLog(id,edit.dataset.editLog);
  if(del)deleteLog(id,del.dataset.deleteLog);
 };
}
function editLog(taskId,logId){
 const task=find(data.tasks,taskId,'task_id'),log=find(data.logs,logId,'log_id');
 if(!task||!canUpdate(task)||!log||String(log.task_id)!==String(taskId))return;
 const minutes=Math.round(Number(log.hours||0)*60);
 modal('Edit time',`<form id="actionForm"><div class="fields"><label>Minutes worked<input name="minutes" type="number" min="1" step="1" value="${minutes}" required></label>${field('work_date','Work date',log.work_date||'','date')}<label class="wide">Notes<textarea name="note">${e(log.note||'')}</textarea></label></div><div class="controls"><button type="button" class="button" id="cancel">Cancel</button><button type="submit" class="button main">Save time</button></div></form>`);
 $('#cancel').onclick=()=>details(taskId);
 $('#actionForm').onsubmit=async ev=>{ev.preventDefault();await submit('editLog',{task_id:taskId,log_id:logId,...Object.fromEntries(new FormData(ev.currentTarget).entries())})};
}
async function deleteLog(taskId,logId,onDone=null){
 const task=find(data.tasks,taskId,'task_id'),log=find(data.logs,logId,'log_id');
 if(!task||!canUpdate(task)||!log||String(log.task_id)!==String(taskId))return;
 if(!await gpConfirm('Delete this '+formatHours(log.hours)+' time entry? This cannot be undone.',{danger:true,confirmLabel:'Delete time entry'}))return;
 try{await rpc('deleteLog',{task_id:taskId,log_id:logId});await refresh();if(onDone)onDone();else details(taskId)}catch(err){gpAlert(err.message)}
}
function taskForm(t,preferredFeatureId=''){const fs=projectFeatures(),who=projectMembers(),f=fs.find(x=>String(x.feature_id)===String(t?.feature_id||preferredFeatureId));modal(t?'Edit task':'New task',`<form id="actionForm"><div class="fields">${field('title','Task title',t?.title||'','text',true)}<label class="wide">Description<textarea name="description">${e(t?.description||'')}</textarea></label>${select('feature_id','Feature',opts(fs,'feature_id'),f?.feature_id||fs[0]?.feature_id)}${select('assignee_member_id','Assigned to',opts(who,'member_id','display_name'),t?.assignee_member_id||who[0]?.member_id)}${select('status','Status',ST.map(x=>({value:x,label:x})),t?.status||'To do')}${select('priority','Priority',PRI.map(x=>({value:x,label:x})),t?.priority||'Normal')}${field('estimated_hours','Estimated hours',t?.estimated_hours||0,'number')}${field('remaining_hours','Remaining hours',t?.remaining_hours||0,'number')}</div><div class="controls"><button type="button" class="button" id="cancel">Cancel</button>${t?'<button class="button danger" type="button" id="deleteTask">Delete task</button>':''}<button class="button main" type="submit">Save task</button></div></form>`);$('#cancel').onclick=closeModal;if(t)$('#deleteTask').onclick=()=>deleteItem('task',t.task_id,t.title);$('#actionForm').onsubmit=async ev=>{ev.preventDefault();const p=Object.fromEntries(new FormData(ev.currentTarget).entries());p.project_id=activeProject;if(t)p.task_id=t.task_id;await submit(t?'editTask':'createTask',p)}}
function editTask(id){const t=find(data.tasks,id,'task_id');if(t&&isPM())taskForm(t)}
function logHours(id){
 const t=find(data.tasks,id,'task_id');if(!t||!canUpdate(t))return;
 const logs=data.logs.filter(l=>String(l.task_id)===String(id));
 const past=logs.length?`<h3 style="margin:22px 0 8px">Previous Time Entries</h3>${logs.map(l=>`<div class="note"><div class="head"><div><b>${formatHours(l.hours)}</b> · ${e(l.work_date)}<div class="sub">${e(l.note||'')}</div></div><div class="actions"><button class="button" type="button" data-edit-log="${e(l.log_id)}">Edit</button><button class="button danger" type="button" data-delete-log="${e(l.log_id)}">Delete</button></div></div></div>`).join('')}`:'<p class="sub" style="margin-top:16px">No previous time entries for this task.</p>';
 modal('Manage time',`<form id="actionForm"><div class="fields"><label>Minutes worked<input name="minutes" type="number" min="1" step="1" value="17" required></label>${field('work_date','Work date',new Date().toLocaleDateString('en-CA'),'date')}<label class="wide">Notes<textarea name="note" placeholder="What did you complete?"></textarea></label></div><div class="controls"><button type="button" class="button" id="cancel">Cancel</button><button type="submit" class="button main">Add time</button></div></form>${past}`);
 $('#cancel').onclick=closeModal;
 $('#actionForm').onsubmit=async ev=>{ev.preventDefault();await submit('logHours',{task_id:id,...Object.fromEntries(new FormData(ev.currentTarget).entries())})};
 $('#modalBody').onclick=ev=>{
  const edit=ev.target.closest('[data-edit-log]'),del=ev.target.closest('[data-delete-log]');
  if(edit)editLog(id,edit.dataset.editLog);
  if(del)deleteLog(id,del.dataset.deleteLog,()=>logHours(id));
 };
}

async function deleteItem(kind,id,name){
 if(!isPM())return;
 if(kind==='milestone'){
  const milestone=data.milestones.find(m=>String(m.milestone_id)===String(id)&&m.project_id===activeProject);
  if(!milestone)return;
  const features=data.features.filter(f=>f.project_id===activeProject&&String(f.milestone_id)===String(id));
  const featureIds=new Set(features.map(f=>String(f.feature_id)));
  const tasks=data.tasks.filter(t=>t.project_id===activeProject&&featureIds.has(String(t.feature_id)));
  const taskIds=new Set(tasks.map(t=>String(t.task_id)));
  const logs=data.logs.filter(l=>taskIds.has(String(l.task_id)));
  const message=`Permanently delete milestone “${name}” and ALL of its contents?\n\nThis deletes:\n• ${features.length} feature(s)\n• ${tasks.length} task(s)\n• ${logs.length} time log(s)\n\nThis cannot be undone. Other milestones will not be affected.`;
  if(!await gpConfirm(message,{danger:true,confirmLabel:'Delete milestone'}))return;
  rpc('deleteMilestone',{milestone_id:id,project_id:activeProject}).then(async()=>{
   if(activeView==='m:'+id)activeView='all';
   collapsedMilestones.delete(String(id));
   closeModal();await refresh();
  }).catch(err=>gpAlert(err.message));
  return;
 }
 const tasksInFeature=kind==='feature'?data.tasks.filter(t=>t.project_id===activeProject&&String(t.feature_id)===String(id)):[];
 const taskIds=new Set(tasksInFeature.map(t=>String(t.task_id)));
 const logs=kind==='feature'?data.logs.filter(l=>taskIds.has(String(l.task_id))).length:kind==='task'?data.logs.filter(l=>String(l.task_id)===String(id)).length:0;
 const message=kind==='feature'? `Permanently delete feature “${name}” and everything inside it?\n\nThis deletes:\n• ${tasksInFeature.length} task(s)\n• ${logs} time log(s)\n\nThis cannot be undone. Other features will not be affected.`:`Permanently delete ${kind} “${name}”?\n\n${logs?'This also permanently deletes '+logs+' time log(s).\n\n':''}This cannot be undone.`;
 if(!await gpConfirm(message,{danger:true,confirmLabel:'Delete '+kind}))return;
 rpc('delete'+kind[0].toUpperCase()+kind.slice(1),{[kind+'_id']:id}).then(async()=>{closeModal();await refresh()}).catch(err=>gpAlert(err.message));
}

/* Milestone imports are additive. No existing projects, task logs or features are replaced. */
async function milestoneFromImport(source){
 if(Array.isArray(source.projects)&&Array.isArray(source.milestones)){
  const list=source.milestones;
  if(!list.length)throw Error('This backup contains no milestones');
  let chosen=list[0];
  if(list.length>1){
   const answer=await gpPrompt('Choose a milestone number to import:\n'+list.map((m,i)=>`${i+1}. ${m.name||m.title||'Untitled'}`).join('\n'),'1');
   if(answer===null)return null;
   const index=Number(answer)-1;
   if(!Number.isInteger(index)||index<0||index>=list.length)throw Error('Please enter a valid milestone number');
   chosen=list[index];
  }
  const features=(source.features||[]).filter(f=>String(f.milestone_id)===String(chosen.milestone_id));
  const fids=new Set(features.map(f=>String(f.feature_id)));
  const tasks=(source.tasks||[]).filter(t=>fids.has(String(t.feature_id)));
  const logs=(source.logs||[]).filter(l=>tasks.some(t=>String(t.task_id)===String(l.task_id)));
  return {milestone:chosen,features,tasks,logs,members:source.members||[]};
 }
 if(source.milestone&&typeof source.milestone==='object'){
  const features=source.features||source.milestone.features||[];
  const tasks=source.tasks||features.flatMap(f=>(f.tasks||[]).map(t=>({...t,feature_id:t.feature_id||f.feature_id||f.id||f.name})));
  return {milestone:source.milestone,features,tasks,logs:source.logs||[],members:source.members||[]};
 }
 throw Error('Expected a milestone file or a full GamePlan backup');
}
async function importOneMilestone(source){
 const parsed=await milestoneFromImport(source);
 if(!parsed)return false;
 const {milestone,features,tasks,logs,members}=parsed;
 if(!Array.isArray(features)||!Array.isArray(tasks)||!Array.isArray(logs))throw Error('Malformed milestone contents');
 const name=String(milestone.name||milestone.title||'').trim();
 if(!name)throw Error('Milestone needs a name');
 const fkey=f=>String(f.feature_id||f.id||f.name||'');
 const tkey=t=>String(t.task_id||t.id||t.title||t.name||'');
 if(features.some(f=>!fkey(f)||!String(f.name||'').trim()))throw Error('Every feature needs a name and identifier');
 if(tasks.some(t=>!tkey(t)||!String(t.title||t.name||'').trim()))throw Error('Every task needs a title and identifier');
 const featureKeys=features.map(fkey);
 if(new Set(featureKeys).size!==featureKeys.length)throw Error('Feature identifiers must be unique');
 const taskKeys=tasks.map(tkey);
 if(new Set(taskKeys).size!==taskKeys.length)throw Error('Task identifiers must be unique');
 if(tasks.some(t=>!featureKeys.includes(String(t.feature_id||t.featureId||''))))throw Error('A task refers to a missing feature');
 const loggedIds=new Set(taskKeys);
 if(logs.some(l=>!loggedIds.has(String(l.task_id))))throw Error('A time log refers to a missing task');
 const message=`Add milestone “${name}” with ${features.length} features and ${tasks.length} tasks to the current project? Existing board data will be kept.`;
 if(!await gpConfirm(message,{confirmLabel:'Import milestone'}))return false;
 const next=structuredClone(data),newMilestoneId=uid();
 const memberById=id=>members.find(m=>String(m.member_id||m.id)===String(id))?.display_name;
 const memberByName=name=>next.members.find(m=>m.display_name.toLowerCase()===String(name).toLowerCase());
 const resolveMember=t=>{
  const name=t.assignee||t.assignee_name||t.assignee_display_name||memberById(t.assignee_member_id);
  let existing=name?memberByName(name):next.members.find(m=>String(m.member_id)===String(t.assignee_member_id));
  if(!existing&&name&&String(name).toLowerCase()!=='unassigned'){
   existing={member_id:uid(),display_name:String(name),google_email:'',active:'Yes'};
   next.members.push(existing);next.roster.push({...existing});
  }
  if(existing&&!next.team.some(m=>m.project_id===activeProject&&m.member_id===existing.member_id))
   next.team.push({project_id:activeProject,member_id:existing.member_id,project_role:'Member',discipline:'',membership_status:'Active'});
  return existing?.member_id||'';
 };
 next.milestones.push({milestone_id:newMilestoneId,project_id:activeProject,name,description:milestone.description||'',status:milestone.status||'To do',target_date:milestone.target_date||''});
 const mappedFeatures=new Map(),mappedTasks=new Map();
 for(const f of features){
  const id=uid();mappedFeatures.set(fkey(f),id);
  next.features.push({feature_id:id,project_id:activeProject,milestone_id:newMilestoneId,name:String(f.name),description:f.description||'',status:f.status||'To do'});
 }
 for(const t of tasks){
  const id=uid();mappedTasks.set(tkey(t),id);
  next.tasks.push({task_id:id,project_id:activeProject,feature_id:mappedFeatures.get(String(t.feature_id||t.featureId)),title:String(t.title||t.name),description:t.description||'',assignee_member_id:resolveMember(t),status:t.status||'To do',priority:t.priority||'Normal',estimated_hours:Number(t.estimated_hours??t.estimate??1)||0,remaining_hours:Number(t.remaining_hours??t.estimated_hours??t.estimate??1)||0,created_by_member_id:'penni',updated_at:new Date().toISOString()});
 }
 for(const l of logs){
  const importedTask=tasks.find(t=>tkey(t)===String(l.task_id));
  const importedTaskId=mappedTasks.get(String(l.task_id));
  const newTask=next.tasks.find(t=>t.task_id===importedTaskId);
  next.logs.push({log_id:uid(),task_id:importedTaskId,member_id:newTask?.assignee_member_id||'penni',hours:Number(l.hours)||0,work_date:l.work_date||l.date||'',note:l.note||'',created_at:l.created_at||''});
 }
 // Keep current board untouched if persistence fails.
 const oldData=data;data=next;
 try{persist()}catch(err){data=oldData;throw err}
 activeView='m:'+newMilestoneId;saveProject();render();return true;
}

 }catch(err){gpAlert('Import failed: '+err.message)}
 finally{ev.target.value=''}
};
