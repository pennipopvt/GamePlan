<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Returning to GamePlan…</title>
<style>body{font:15px system-ui,sans-serif;background:#faf7fa;color:#342638;display:grid;place-items:center;min-height:95vh}main{max-width:500px;padding:24px;text-align:center}a{color:#a81578}</style></head>
<body><main><p>Connecting Discord to GamePlan…</p><p id="message"></p><a href="../index.html">Return to GamePlan</a></main>
<script type="module">
import {createGamePlanCloud} from './gameplan-cloud.js?v=2026.11.05.54';
const next=()=>{history.replaceState(null,'',location.pathname);location.replace('../index.html')};
try{
 const cfg=JSON.parse(localStorage.getItem('gameplan-cloud-config-v1')||'null');
 if(!cfg?.url||!cfg?.key){next()}
 else{
  const cloud=createGamePlanCloud({url:cfg.url,publishableKey:cfg.key});
  const session=await cloud.getSession();
  if(session)next();
  else{
   document.getElementById('message').textContent='Could not finish sign-in. You can return to GamePlan and reconnect.';
   history.replaceState(null,'',location.pathname);
  }
 }
}catch(err){
 document.getElementById('message').textContent='Sign-in issue: '+err.message;
 history.replaceState(null,'',location.pathname);
}
</script></body></html>
