name: Check and recover GitHub Pages deployment
on:
  push:
    paths:
      - '.github/workflows/recover-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  clear-stale-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and retry cancellation of the stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          endpoint="repos/${GITHUB_REPOSITORY}/pages/deployments/1ae2a120eb7b1111a639b366a527822ca0be84f3"
          echo "BEFORE:"
          gh api "$endpoint" || true
          echo "CANCEL:"
          gh api --method POST "$endpoint/cancel"
          sleep 7
          echo "AFTER:"
          gh api "$endpoint" || true
